<a-scene
  environment="preset: default; lighting: none; shadow: true"
  coaching-overlay
  enable-interaction-immediate
  next-button
  rotate-button
  selectcomponent
  xrextras-gesture-detector
  landing-page="logoSrc: ./VaderLab-Logo.png; backgroundColor: #f7fafa; textColor: #1a3d40"
  xrextras-loading
  xrextras-runtime-error
  ssao
    renderer="colorManagement: true; physicallyCorrectLights: true; exposure: 1.08"
  xrweb="allowedDevices: any;
      defaultEnvironmentFogIntensity: 0.15;
          defaultEnvironmentFloorTexture: #groundTex;
      defaultEnvironmentFloorColor: #1f2328;
      defaultEnvironmentSkyBottomColor: #10161f;
      defaultEnvironmentSkyTopColor: #2a3444;
      defaultEnvironmentSkyGradientStrength: 0.4;
          scale: absolute">
  <a-assets>
    <a-asset-item id="hospital_env" src="assets/hospital_env.exr"></a-asset-item>
    <a-asset-item id="gantry_housing_asset" src="assets/gantry_housing.glb"></a-asset-item>
    <a-asset-item id="gantry_ring_asset" src="assets/gantry_ring.glb"></a-asset-item>
    <a-asset-item id="xray_tube_asset" src="assets/xray_tube.glb"></a-asset-item>
    <a-asset-item id="detector_array_asset" src="assets/detector_array.glb"></a-asset-item>
    <a-asset-item id="slip_ring_assembly_asset" src="assets/slip_ring_assembly.glb"></a-asset-item>
    <a-asset-item id="collimators_asset" src="assets/collimators.glb"></a-asset-item>
    <a-asset-item id="bore_asset" src="assets/bore.glb"></a-asset-item>
    <a-asset-item id="patient_table_asset" src="assets/patient_table.glb"></a-asset-item>
    <a-asset-item id="control_console_asset" src="assets/control_console.glb"></a-asset-item>
    <a-asset-item
      id="image_reconstruction_computer_asset"
      src="assets/image_reconstruction_computer.glb"></a-asset-item>
    <a-asset-item id="cooling_system_asset" src="assets/cooling_system.glb"></a-asset-item>
    <a-asset-item
      id="laser_positioning_lights_asset"
      src="assets/laser_positioning_lights.glb"></a-asset-item>
    <a-asset-item id="laser_surface_1_asset" src="assets/laser1.glb"></a-asset-item>
    <a-asset-item id="laser_surface_2_asset" src="assets/laser2.glb"></a-asset-item>
    <a-asset-item id="laser_surface_3_asset" src="assets/laser3.glb"></a-asset-item>
    <a-asset-item id="laser_origin_1_asset" src="assets/laserorigin1.glb"></a-asset-item>
    <a-asset-item id="laser_origin_2_asset" src="assets/laserorigin2.glb"></a-asset-item>
    <a-asset-item id="laser_origin_3_asset" src="assets/laserorigin3.glb"></a-asset-item>
    <a-asset-item id="screen_asset" src="assets/screen.glb"></a-asset-item>
    <a-asset-item
      id="safety_and_intercom_systems_asset"
      src="assets/safety_and_intercom_systems.glb"></a-asset-item>
  </a-assets>

  <!-- Camera with raycaster for tap interactions -->
  <a-camera
    id="camera"
    position="0 0.55 6.6"
    rotation="0 0 0"
    raycaster="objects: .cantap, .interactable"
    cursor="rayOrigin: mouse; fuse: false">
  </a-camera>

  <!-- Lights -->
  <a-entity
    light="type: directional; intensity: 3.4; castShadow: true; shadowMapHeight: 4096; shadowMapWidth: 4096; shadowRadius: 0.85; shadowBias: -0.00012; target: #group"
    xrextras-attach="target: group; offset: -8 15 4"
    position="-20 20 20">
  </a-entity>
  <a-entity light="type: ambient; intensity: 0.08; color: #e8f0ff"></a-entity>

  <a-entity
    light="type: hemisphere;
      intensity: 0.12;
      groundColor: #1a2029;
      color: #4f5f77">
  </a-entity>

  <a-entity
    light="type: directional;
          intensity: 2.0;
          color: #d9e9ff"
    position="10 5 -7">
  </a-entity>

  <a-entity
    light="type: directional;
          intensity: 1.4;
          castShadow: false;
          color: #ffe7d1"
    position="-12 6 -10">
  </a-entity>

  <a-entity
    light="type: directional;
          intensity: 1.2;
          castShadow: false;
          color: #f7fbff"
    xrextras-attach="target: camera; offset: 0 1.4 1.2">
  </a-entity>

  <!-- Main manipulatable group -->
  <a-entity
    id="group"
    scale="1.44 1.44 1.44"
    auto-floor-anchor
    xrextras-gesture-detector
    xrextras-two-finger-rotate
    xrextras-pinch-scale>
    <a-entity id="model_anchor" position="0 -1.45 0">
    <!-- Rotation pivot (optional, you can keep it for organization) -->
    <a-entity id="rotation_pivot" position="0 0 0">
      <a-entity id="xray_tube" gltf-model="#xray_tube_asset" class="cantap rotatable interactable" shadow="cast: true; receive: true">
      </a-entity>

      <a-entity
        id="detector_array"
        gltf-model="#detector_array_asset"
        class="cantap rotatable interactable"
        shadow="cast: true; receive: true"
        metallic>
      </a-entity>

      <a-entity
        id="collimators"
        gltf-model="#collimators_asset"
        class="cantap rotatable interactable"
        shadow="cast: true; receive: true"
        metallic>
      </a-entity>
    </a-entity>

    <!-- Other models now also respond to gestures -->
    <a-entity id="gantry_housing" gltf-model="#gantry_housing_asset" class="cantap interactable" shadow="cast: true; receive: true">
    </a-entity>

    <a-entity id="gantry_ring" gltf-model="#gantry_ring_asset" class="cantap interactable" shadow="cast: true; receive: true">
    </a-entity>

    <a-entity
      id="slip_ring_assembly"
      gltf-model="#slip_ring_assembly_asset"
      class="cantap interactable"
      shadow="cast: true; receive: true"
      slip-ring-assembly-metal>
    </a-entity>

    <a-entity id="bore" gltf-model="#bore_asset" class="cantap interactable" shadow="cast: true; receive: true"></a-entity>
    <a-entity
      id="patient_table"
      gltf-model="#patient_table_asset"
      class="cantap interactable"
      shadow="cast: true; receive: true"
      fabric></a-entity>
    <a-entity
      id="control_console"
      gltf-model="#control_console_asset"
      class="cantap interactable"
      shadow="cast: true; receive: true"></a-entity>
    <a-entity
      id="image_reconstruction_computer"
      gltf-model="#image_reconstruction_computer_asset"
      class="cantap interactable"
      shadow="cast: true; receive: true"
      dark-plastic>
    </a-entity>
    <a-entity
      id="cooling_system"
      gltf-model="#cooling_system_asset"
      class="cantap interactable"
      shadow="cast: true; receive: true"
      fabric>
    </a-entity>
    <a-entity
      id="laser_positioning_lights"
      gltf-model="#laser_positioning_lights_asset"
      class="cantap interactable"
      shadow="cast: true; receive: true"
      laser-positioning-dark>
    </a-entity>
    <a-entity
      id="laser_surface_1"
      gltf-model="#laser_surface_1_asset"
      class="cantap interactable"
      laser-surface>
    </a-entity>
    <a-entity
      id="laser_surface_2"
      gltf-model="#laser_surface_2_asset"
      class="cantap interactable"
      laser-surface>
    </a-entity>
    <a-entity
      id="laser_surface_3"
      gltf-model="#laser_surface_3_asset"
      class="cantap interactable"
      laser-surface>
    </a-entity>
    <a-entity id="laser_origin_1" gltf-model="#laser_origin_1_asset" visible="false"></a-entity>
    <a-entity id="laser_origin_2" gltf-model="#laser_origin_2_asset" visible="false"></a-entity>
    <a-entity id="laser_origin_3" gltf-model="#laser_origin_3_asset" visible="false"></a-entity>
    <a-entity
      id="screen"
      gltf-model="#screen_asset"
      class="cantap interactable"
      screen-glow>
    </a-entity>
    <a-entity
      id="safety_and_intercom_systems"
      gltf-model="#safety_and_intercom_systems_asset"
      class="cantap interactable"
      shadow="cast: true; receive: true"></a-entity>
    </a-entity>
  </a-entity>

  <!-- Ground -->
  <a-plane
    id="ground"
    rotation="-90 0 0"
    position="0 -200 0"
    width="1000"
    height="1000"
    material="shader: shadow"
    shadow="receive: true">
  </a-plane>

  <!-- Debug: floor reference at y=0. Set visible="true" to verify AR floor alignment. -->
  <a-entity id="debug-floor" visible="false" position="0 0 0">
    <a-plane rotation="-90 0 0" width="6" height="6"
      material="color: #00ff88; opacity: 0.35; transparent: true; side: double; depthWrite: false; wireframe: false">
    </a-plane>
    <a-plane rotation="-90 0 0" width="6" height="6"
      material="color: #ffffff; opacity: 0.15; transparent: true; side: double; wireframe: true">
    </a-plane>
  </a-entity>
</a-scene>
