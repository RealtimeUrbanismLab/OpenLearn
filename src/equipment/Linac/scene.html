<a-scene
  environment="preset: default; lighting: none; shadow: true"
  coaching-overlay
  enable-interaction-immediate
  next-button
  rotate-button
  selectcomponent
  xrextras-gesture-detector
  landing-page="logoSrc: ./VaderLab-Logo.png; backgroundColor: #f7fafa; textColor: #1a3d40"
  xrextras-loading
  xrextras-runtime-error
  ssao
    renderer="colorManagement: true; physicallyCorrectLights: true; exposure: 1.08"
  xrweb="allowedDevices: any;
      defaultEnvironmentFogIntensity: 0.15;
          defaultEnvironmentFloorTexture: #groundTex;
      defaultEnvironmentFloorColor: #1f2328;
      defaultEnvironmentSkyBottomColor: #10161f;
      defaultEnvironmentSkyTopColor: #2a3444;
      defaultEnvironmentSkyGradientStrength: 0.4;
          scale: absolute">
  <a-assets>
    <a-asset-item id="hospital_env" src="assets/hospital_env.exr"></a-asset-item>
    <!-- Interactable models (matched by Modelname in data.js) -->
    <a-asset-item id="01_Bed_asset" src="assets/01_Bed.glb"></a-asset-item>
    <a-asset-item id="02_Klystron_Inside_asset" src="assets/02_Klystron_Inside.glb"></a-asset-item>
    <a-asset-item id="03_Cooling_system_asset" src="assets/03_Cooling_system.glb"></a-asset-item>
    <a-asset-item id="04_Circulator_asset" src="assets/04_Circulator.glb"></a-asset-item>
    <a-asset-item id="05_Electro_Gun_Split_asset" src="assets/05_Electro_Gun_Split.glb"></a-asset-item>
    <a-asset-item id="06_Waveguide_Split_asset" src="assets/06_Waveguide_Split.glb"></a-asset-item>
    <a-asset-item id="07_Bending_Magnet_asset" src="assets/07_Bending_Magnet.glb"></a-asset-item>
    <a-asset-item id="08_Target_asset" src="assets/08_Target.glb"></a-asset-item>
    <a-asset-item id="09_Primary_Collimator_asset" src="assets/09_Primary_Collimator.glb"></a-asset-item>
    <a-asset-item id="10_Secondary_Collimator_asset" src="assets/10_Secondary_Collimator.glb"></a-asset-item>
    <a-asset-item id="11_Flatening_Filter_asset" src="assets/11_Flatening_Filter.glb"></a-asset-item>
    <a-asset-item id="12_X_Jaws_asset" src="assets/12_X_Jaws.glb"></a-asset-item>
    <a-asset-item id="13_Y_Jaws_asset" src="assets/13_Y_Jaws.glb"></a-asset-item>
    <a-asset-item id="14_MLC_asset" src="assets/14_MLC.glb"></a-asset-item>
    <a-asset-item id="15_KV_Imagine_System_asset" src="assets/15_KV_Imagine_System.glb"></a-asset-item>
    <!-- Additional visual parts (not in data.js, not tappable) -->
    <a-asset-item id="01_Casing_asset" src="assets/01_Casing.glb"></a-asset-item>
    <a-asset-item id="01_Oil_Tank_asset" src="assets/01_Oil_Tank.glb"></a-asset-item>
    <a-asset-item id="02_Klystron_Outside_asset" src="assets/02_Klystron_Outside.glb"></a-asset-item>
    <a-asset-item id="05_Electro_Gun_asset" src="assets/05_Electro_Gun.glb"></a-asset-item>
    <a-asset-item id="06_Waveguide_asset" src="assets/06_Waveguide.glb"></a-asset-item>
  </a-assets>

  <!-- Camera with raycaster for tap interactions -->
  <a-camera
    id="camera"
    position="6.6 0.55 0"
    rotation="0 90 0"
    raycaster="objects: .cantap, .interactable"
    cursor="rayOrigin: mouse; fuse: false">
  </a-camera>

  <!-- Lights -->
  <a-entity
    light="type: directional; intensity: 3.4; castShadow: true; shadowMapHeight: 4096; shadowMapWidth: 4096; shadowRadius: 0.85; shadowBias: -0.00012; target: #group"
    xrextras-attach="target: group; offset: -8 15 4"
    position="-20 20 20">
  </a-entity>
  <a-entity light="type: ambient; intensity: 0.08; color: #e8f0ff"></a-entity>

  <a-entity
    light="type: hemisphere;
      intensity: 0.12;
      groundColor: #1a2029;
      color: #4f5f77">
  </a-entity>

  <a-entity
    light="type: directional;
          intensity: 2.0;
          color: #d9e9ff"
    position="10 5 -7">
  </a-entity>

  <a-entity
    light="type: directional;
          intensity: 1.4;
          castShadow: false;
          color: #ffe7d1"
    position="-12 6 -10">
  </a-entity>

  <a-entity
    light="type: directional;
          intensity: 1.2;
          castShadow: false;
          color: #f7fbff"
    xrextras-attach="target: camera; offset: 0 1.4 1.2">
  </a-entity>

  <!-- Main manipulatable group -->
  <a-entity
    id="group"
    scale="1.44 1.44 1.44"
    xrextras-gesture-detector
    xrextras-two-finger-rotate
    xrextras-pinch-scale>
    <a-entity id="model_anchor" position="0 -0.1 0">

    <a-entity id="01_Bed" gltf-model="#01_Bed_asset" class="cantap interactable" shadow="cast: true; receive: true" fabric></a-entity>
    <a-entity id="02_Klystron_Inside" gltf-model="#02_Klystron_Inside_asset" class="cantap interactable" shadow="cast: true; receive: true" metallic></a-entity>
    <a-entity id="03_Cooling_system" gltf-model="#03_Cooling_system_asset" class="cantap interactable" shadow="cast: true; receive: true" metallic></a-entity>
    <a-entity id="04_Circulator" gltf-model="#04_Circulator_asset" class="cantap interactable" shadow="cast: true; receive: true" metallic></a-entity>
    <a-entity id="05_Electro_Gun_Split" gltf-model="#05_Electro_Gun_Split_asset" class="cantap interactable" shadow="cast: true; receive: true" metallic></a-entity>
    <a-entity id="06_Waveguide_Split" gltf-model="#06_Waveguide_Split_asset" class="cantap interactable" shadow="cast: true; receive: true" metallic></a-entity>
    <a-entity id="07_Bending_Magnet" gltf-model="#07_Bending_Magnet_asset" class="cantap interactable" shadow="cast: true; receive: true" metallic></a-entity>
    <a-entity id="08_Target" gltf-model="#08_Target_asset" class="cantap interactable" shadow="cast: true; receive: true" metallic></a-entity>
    <a-entity id="09_Primary_Collimator" gltf-model="#09_Primary_Collimator_asset" class="cantap interactable" shadow="cast: true; receive: true" metallic></a-entity>
    <a-entity id="10_Secondary_Collimator" gltf-model="#10_Secondary_Collimator_asset" class="cantap interactable" shadow="cast: true; receive: true" metallic></a-entity>
    <a-entity id="11_Flatening_Filter" gltf-model="#11_Flatening_Filter_asset" class="cantap interactable" shadow="cast: true; receive: true" metallic></a-entity>
    <a-entity id="12_X_Jaws" gltf-model="#12_X_Jaws_asset" class="cantap interactable" shadow="cast: true; receive: true" metallic></a-entity>
    <a-entity id="13_Y_Jaws" gltf-model="#13_Y_Jaws_asset" class="cantap interactable" shadow="cast: true; receive: true" metallic></a-entity>
    <a-entity id="14_MLC" gltf-model="#14_MLC_asset" class="cantap interactable" shadow="cast: true; receive: true" metallic></a-entity>
    <a-entity id="15_KV_Imagine_System" gltf-model="#15_KV_Imagine_System_asset" class="cantap interactable" shadow="cast: true; receive: true" med-plastic></a-entity>

    <!-- Additional visual parts — loaded for completeness, not tappable -->
    <a-entity gltf-model="#01_Casing_asset" shadow="cast: true; receive: true" med-plastic></a-entity>
    <a-entity gltf-model="#01_Oil_Tank_asset" shadow="cast: true; receive: true" metallic></a-entity>
    <a-entity gltf-model="#02_Klystron_Outside_asset" shadow="cast: true; receive: true" dark-plastic></a-entity>
    <a-entity gltf-model="#05_Electro_Gun_asset" shadow="cast: true; receive: true" metallic></a-entity>
    <a-entity gltf-model="#06_Waveguide_asset" shadow="cast: true; receive: true" metallic></a-entity>

    </a-entity>
  </a-entity>

  <!-- Ground -->
  <a-plane
    id="ground"
    rotation="-90 0 0"
    position="0 -200 0"
    width="1000"
    height="1000"
    material="shader: shadow"
    shadow="receive: true">
  </a-plane>
</a-scene>
