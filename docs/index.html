<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenLearn — Medical Equipment AR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f7fafa;
      color: #1a3d40;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .logo {
      width: 220px;
      margin-bottom: 2rem;
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #1a3d40; }
    .subtitle { color: #5a888c; margin-bottom: 2.5rem; font-size: 1rem; }
    .cards {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    a.card {
      display: block;
      background: #ffffff;
      border: 1.5px solid #b8d8db;
      border-radius: 14px;
      padding: 2rem 2.5rem;
      text-decoration: none;
      color: inherit;
      min-width: 220px;
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(58,125,130,0.07);
    }
    a.card:hover {
      border-color: #3a7d82;
      box-shadow: 0 4px 16px rgba(58,125,130,0.18);
    }
    a.card h2 { font-size: 1.2rem; margin-bottom: 0.4rem; color: #1a3d40; }
    a.card span { color: #5a888c; font-size: 0.9rem; }
    .footer {
      margin-top: 3rem;
      color: #8aacaf;
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <a href="https://vaiderlab.org/" target="_blank" rel="noopener">
    <img class="logo" src="./VaderLab-Logo.png" alt="VaiderLab Logo">
  </a>
  <h1>OpenLearn</h1>
  <p class="subtitle">OpenLearn - Interactive experiences for medical education</p>
  <div class="cards">
    <a class="card" href="./CTScanner/">
      <h2>CT Scanner</h2>
      <span>Explore all components in AR</span>
    </a>
    <a class="card" href="./Linac/">
      <h2>Linear Accelerator</h2>
      <span>Explore all components in AR</span>
    </a>
  </div>
  <p class="footer">Use with your mobile camera or tablet in a large room</p>
</body>
</html>
